name: Mariangel MVP Validation

on:
  pull_request:
    paths:
      - "app/mariangel-heart-ice/**"
      - "components/product/MariangelHeartIceProductPage.tsx"
      - "components/product/MariangelStructuredData.tsx"
      - "components/product/mariangel-heart-ice-data.ts"
      - "scripts/validate-mariangel-mvp.mjs"
      - ".github/workflows/mariangel-mvp.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Static MVP validation
        run: node scripts/validate-mariangel-mvp.mjs
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
